name: Deploy Strapi to aaPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: github.actor == 'Muthumari-1993'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Source Code
        run: |
          rsync -avz --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/

      - name: Build & Restart Strapi
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ${{ secrets.SERVER_PATH }}
            npm install
            npm run build

            if pm2 describe qubistrapiadmin > /dev/null; then
              pm2 restart qubistrapiadmin
            else
              pm2 start npm --name qubistrapiadmin -- run start
            fi

            pm2 save
          EOF